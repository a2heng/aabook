<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>有声书流水线 · 结构与参数</title>
<style>
:root{color-scheme:dark;--bg:#0d1017;--panel:#151a23;--panel2:#1b2230;--line:#26303f;--fg:#e6ecf3;--dim:#8b97a8;
  --accent:#5aa9ff;--ok:#43c785;--warn:#ffb454;--bad:#ff7b7b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:6;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{font-size:15px}
header select,header button,header input{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px}
header button{cursor:pointer}
header button.primary{background:var(--accent);border-color:var(--accent);color:#0b0f15;font-weight:700}
header .grow{flex:1}
a{color:var(--accent);text-decoration:none}
main{padding:16px 18px 80px;max-width:1500px;margin:0 auto}
.product{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(90deg,#12233a,#151a23);border:1px solid #2b4a72;border-radius:12px;padding:10px 14px}
.product b{color:#9fd0ff}
.chip{display:inline-block;background:#0f1720;border:1px solid var(--line);border-radius:999px;padding:1px 10px;margin:2px;font-size:12.5px}
.chip code{background:none;border:none;padding:0}
.flow{display:flex;gap:10px;align-items:stretch;margin:16px 0;overflow-x:auto;padding-bottom:6px}
.stage{min-width:250px;max-width:340px;flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stage.editable{border-color:#2b4a72;box-shadow:0 0 0 1px #1c3a5c inset}
.stage h3{margin:0 0 4px;font-size:14px}
.stage .script{color:var(--dim);font-size:12px}
.stage .io{font-size:12.5px;margin:6px 0;color:#cfe3ff}
.stage .io span{color:var(--dim)}
.stage .detail{font-size:12.5px;color:var(--dim)}
.arrow{display:flex;align-items:center;color:var(--dim);font-size:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
.panel h2{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:3px}
.field input[type=number]{width:100%;background:#0f141b;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:5px 8px}
.field input[type=text]{width:100%;background:#0f141b;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:5px 8px}
.field textarea{width:100%;min-height:130px;background:#0f141b;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:8px;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace}
.overridden{color:var(--warn);font-size:11.5px}
.prompts{display:grid;grid-template-columns:1fr;gap:12px;margin-top:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sub{margin:0 0 6px;font-size:13px;color:var(--dim)}
.doc{background:#0f141b;border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-height:420px;overflow:auto;font-size:14px;line-height:1.95;word-break:break-word}
.doc p{margin:0 0 .55em;text-indent:2em}
.doc p:empty{display:none}
.doc .who{display:inline-block;font-size:11px;font-weight:700;color:#9fd0ff;background:#16314f;border-radius:6px;padding:0 6px;margin:0 2px;vertical-align:1px}
.doc .speech{background:#152238;border-radius:8px;box-shadow:inset 0 0 0 1px #2b4a72;padding:1px 5px}
.log{max-height:260px;overflow:auto}
.log table{border-collapse:collapse;width:100%;font-size:12.5px}
.log th,.log td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.log th{color:var(--dim);font-weight:500}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0d1219;border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:12px}
.toast{position:fixed;right:16px;bottom:16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:none}
.toast.ok{border-color:var(--ok)}.toast.bad{border-color:var(--bad)}
@media (max-width:820px){main{padding:12px}.stage{min-width:220px}}
</style></head><body>
<header>
  <b>有声书流水线</b>
  <span>产品 = 文本，章节只是标记</span>
  <span class="grow"></span>
  <select id="booksel"></select>
  <button id="reload">刷新</button>
  <button id="save" class="primary">保存覆盖</button>
  <button id="reset">清除覆盖</button>
  <nav style="display:flex;gap:12px;font-size:13px">
    <a href="/dashboard">看板</a>
    <a id="live" href="#">Live</a>
    <a id="raw" href="#">原始 I/O</a>
    <a href="/">文件库</a>
  </nav>
</header>
<main>
  <div class="product" id="product"><b>产品</b><span>加载中…</span></div>
  <div id="flow" class="flow"></div>

  <div class="panel">
    <h2>可改参数（保存到覆盖层，mark_script 启动时读取）</h2>
    <div class="grid" id="params"></div>
  </div>

  <div class="panel">
    <h2>提示词（留空=用代码默认值）</h2>
    <div class="prompts" id="prompts"></div>
  </div>

  <div class="panel">
    <h2>例章 ch<span id="exlabel">003</span> · 输入 / 输出
      <select id="exch" style="margin-left:8px"></select>
      <button id="run" class="primary" style="float:right">保存覆盖并运行本章</button>
      <span class="overridden" id="runstatus" style="float:right;margin-right:10px"></span>
    </h2>
    <div class="cols">
      <div><h3 class="sub">输入（原文·段落流）</h3><div class="doc" id="rawdoc">加载中…</div></div>
      <div><h3 class="sub">输出（marked·&lt;角色&gt; 标记）</h3><div class="doc" id="markeddoc">加载中…</div></div>
    </div>
    <div class="detail" style="margin-top:8px">运行读取已保存的覆盖（workflow.json），日志：<a id="runlog" href="#" target="_blank">—</a> ·
      原始 LLM I/O：<a id="rawio" href="#" target="_blank">—</a></div>
  </div>

  <div class="panel">
    <h2>改动记录（双向可见）<span class="overridden" id="where"></span></h2>
    <div class="log"><table id="logtable"><thead><tr><th>时间</th><th>来源</th><th>改动</th></tr></thead><tbody></tbody></table></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const BASE = "/";
let state = null, dirty = false;

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function fmtTime(ts){if(!ts)return '';const d=new Date(ts*1000);return d.toLocaleString('zh-CN',{hour12:false});}
function toast(msg, ok){const t=$('toast');t.textContent=msg;t.className='toast '+(ok?'ok':'bad');t.style.display='block';setTimeout(()=>{t.style.display='none';},2600);}

function renderProduct(p){
  const tags=(p.tags||[]).map(t=>`<span class="chip">${esc(t.label)} <code>${esc(t.mark)}</code> <span style="color:var(--dim)">${esc(t.note)}</span></span>`).join('');
  $('product').innerHTML = `<b>${esc(p.product.name)}</b><span style="color:var(--dim)">${esc(p.product.note)}</span><span>${tags}</span>`;
}
function renderFlow(p){
  const parts=[];
  (p.stages||[]).forEach((s,i)=>{
    if(i) parts.push('<div class="arrow">→</div>');
    parts.push(`<div class="stage ${s.editable?'editable':''}">
      <h3>${esc(s.title)}</h3>
      <div class="script">${esc(s.script)}</div>
      <div class="io"><span>入</span> ${esc(s.input)}<br><span>出</span> ${esc(s.output)}</div>
      <div class="detail">${esc(s.detail)}</div>
      <div class="detail" style="margin-top:6px"><code>${esc(s.command)}</code></div>
    </div>`);
  });
  $('flow').innerHTML = parts.join('');
}
function renderParams(st){
  const defs = st.defaults.params, over = st.overlay.params || {};
  const rows = [
    ['batch','batch（前 N 章喂全文）', defs.batch, 1],
    ['max_steps','max_steps（每章工具步数）', defs.max_steps, 1],
  ];
  let html = rows.map(([key,label,val,min])=>`<div class="field"><label>${esc(label)} ${over[key]!==undefined?'<span class="overridden">已覆盖</span>':''}</label>
    <input type="number" data-param="${key}" min="${min}" value="${esc(st.params[key])}"></div>`).join('');
  const thinkOver = over.think!==undefined?'<span class="overridden">已覆盖</span>':'';
  html += `<div class="field"><label>think（模型思考） ${thinkOver}</label>
    <input type="checkbox" data-param="think" ${st.params.think?'checked':''}> 启用</div>`;
  $('params').innerHTML = html;
  $('params').querySelectorAll('[data-param]').forEach(el=>{
    el.addEventListener('input',()=>{dirty=true;});
    el.addEventListener('change',()=>{dirty=true;});
  });
}
function renderPrompts(st){
  const defs = st.defaults.prompts, over = st.overlay.prompts || {};
  const labels = {local_system:'主提示词（LOCAL_SYSTEM）', step_mark:'任务提示词（STEP_MARK）', roster_system:'人物词典提示词（ROSTER_SYSTEM）'};
  $('prompts').innerHTML = Object.keys(labels).map(key=>{
    const value = over[key] !== undefined ? over[key] : defs[key];   // 预填当前生效文本，可直接改
    return `<div class="field"><label>${esc(labels[key])} ${over[key]!==undefined?'<span class="overridden">已覆盖（保存即持久化）</span>':''}</label>
      <textarea data-prompt="${key}">${esc(value)}</textarea></div>`;
  }).join('');
  $('prompts').querySelectorAll('[data-prompt]').forEach(el=>el.addEventListener('input',()=>{dirty=true;}));
}
function renderLog(st){
  const rows = (st.changelog||[]).map(e=>{
    const changed=[];
    Object.keys(e.params||{}).forEach(k=>changed.push(`param ${k}=${JSON.stringify(e.params[k])}`));
    Object.keys(e.prompts||{}).forEach(k=>changed.push(`prompt ${k}`));
    if(e.cleared) changed.push('清除覆盖');
    return `<tr><td>${fmtTime(e.ts)}</td><td>${esc(e.actor||'')}</td><td>${esc(changed.join(' · '))}</td></tr>`;
  });
  $('logtable').querySelector('tbody').innerHTML = rows.join('') || '<tr><td colspan="3" style="color:var(--dim)">暂无改动</td></tr>';
  $('where').textContent = st.paths ? `覆盖文件：${st.paths.overlay}` : '';
}
let exampleChapter = Math.max(1, parseInt(new URLSearchParams(location.search).get('ch') || '3', 10) || 3);
const pad = (n) => String(n).padStart(3, '0');
function setExampleChapter(value){
  exampleChapter = Math.max(1, parseInt(value, 10) || 1);
  $('exlabel').textContent = pad(exampleChapter);
  const url = new URL(location.href);
  if(state) url.searchParams.set('book', state.book);
  url.searchParams.set('ch', exampleChapter);
  history.replaceState(null, '', url);
  lastChapterSig = '';
  loadChapter();
}
async function loadChapterList(){
  const book = state && state.book;
  if(!book) return;
  try{
    const data = await (await fetch('/chapters.json?book='+encodeURIComponent(book), {cache:'no-store'})).json();
    const ids = data.chapters || [];
    const sel = $('exch');
    sel.innerHTML = ids.map(id=>`<option value="${id}">ch${pad(id)}</option>`).join('');
    if(!ids.includes(exampleChapter)) sel.insertAdjacentHTML('afterbegin', `<option value="${exampleChapter}">ch${pad(exampleChapter)}</option>`);
    sel.value = String(exampleChapter);
  }catch(err){}
}

function renderDoc(text, marked){
  const paras = String(text||'').split(/\n+/);
  return paras.map(p=>{
    const body = p.replace(/^[ \t\u3000]+/, '');
    if(!body) return '';
    let h = esc(body);
    if(marked){
      h = h.replace(/&lt;([^&<>]{1,24})&gt;/g, '<span class="who">$1</span><span class="speech">')
           .replace(/&lt;\/([^&<>]{1,24})&gt;/g, '</span>');
    }
    return `<p>${h}</p>`;
  }).join('');
}
function fmtTs(ts){return ts?new Date(ts*1000).toLocaleString('zh-CN',{hour12:false}):'—';}
let chapterTimer = null, lastChapterSig = '', lastStateSig = '';
async function loadChapter(){
  const book = state && state.book;
  if(!book) return;
  try{
    const c = await (await fetch('/chapter.json?book='+encodeURIComponent(book)+'&chapter='+exampleChapter+'&t='+Date.now(),{cache:'no-store'})).json();
    const sig = [c.raw.length, c.marked.length, c.marked_mtime, c.running].join('|');
    if(sig === lastChapterSig) return;            // no change -> touch nothing (no flicker)
    lastChapterSig = sig;
    $('rawdoc').innerHTML = c.raw ? renderDoc(c.raw, false) : '<span style="color:var(--dim)">（无输入文件）</span>';
    $('markeddoc').innerHTML = c.marked ? renderDoc(c.marked, true) : '<span style="color:var(--dim)">（尚未产出；点右上「保存覆盖并运行本章」）</span>';
    $('runstatus').textContent = c.running ? ('运行中 pid '+c.pid) : (c.marked ? ('已产出 · '+fmtTs(c.marked_mtime)) : '未产出');
  }catch(err){}
}
function render(st){
  state = st;
  renderProduct(st.pipeline);
  renderFlow(st.pipeline);
  renderParams(st);
  renderPrompts(st);
  renderLog(st);
  const book = encodeURIComponent(st.book);
  $('live').href = "/live?book=" + book;
  $('raw').href = "/outputs/" + book + "/script/llm_raw.html";
  $('rawio').href = $('raw').href;
  $('rawio').textContent = 'llm_raw.html';
  lastChapterSig = '';
  loadChapterList();
  loadChapter();
  if(chapterTimer) clearInterval(chapterTimer);
  chapterTimer = setInterval(loadChapter, 3000);
}
async function runChapter(){
  const book = state && state.book;
  if(!book) return;
  try{ await save(); }catch(err){ return; }
  try{
    const res = await (await fetch('/workflow/run', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({book, chapter:exampleChapter})})).json();
    $('runlog').href = "/" + res.log;
    $('runlog').textContent = res.log;
    toast('已启动 ch'+pad(exampleChapter), true);
    loadChapter();
  }catch(err){toast('启动失败：'+err, false);}
}

function collect(){
  const params = {};
  document.querySelectorAll('[data-param]').forEach(el=>{
    const key = el.getAttribute('data-param');
    if(el.type==='checkbox') params[key]=el.checked;
    else { const v=parseInt(el.value,10); if(!Number.isNaN(v)) params[key]=v; }
  });
  const prompts = {};
  document.querySelectorAll('[data-prompt]').forEach(el=>{
    const v=el.value.trim();
    if(v) prompts[el.getAttribute('data-prompt')]=v;   // empty = keep default
  });
  return {params, prompts};
}
async function loadBooks(){
  try{
    const list = await (await fetch('/books.json?t='+Date.now(),{cache:'no-store'})).json();
    const sel=$('booksel');
    const qsBook = new URLSearchParams(location.search).get('book');
    sel.innerHTML = list.map(x=>`<option value="${esc(x.book)}">${esc(x.book)}</option>`).join('');
    if(qsBook) sel.value=qsBook;
    sel.addEventListener('change',()=>{location.search='?book='+encodeURIComponent(sel.value);});
    return sel.value;
  }catch(err){toast('读取 books.json 失败', false); return '';}
}
async function loadState(){
  const book = new URLSearchParams(location.search).get('book') || $('booksel').value;
  if(!book) return;
  if(!$('booksel').value) $('booksel').value=book;
  dirty=false;
  try{
    const st = await (await fetch('/workflow.json?book='+encodeURIComponent(book)+'&t='+Date.now(),{cache:'no-store'})).json();
    const sig = JSON.stringify({p:st.params, r:st.prompts, o:st.overlay, c:st.changelog});
    if(sig === lastStateSig) return;              // nothing changed -> no DOM churn
    lastStateSig = sig;
    render(st);
  }catch(err){toast('读取 workflow.json 失败：'+err, false);}
}
async function save(){
  const book = new URLSearchParams(location.search).get('book') || $('booksel').value;
  try{
    const body = {book, ...collect()};
    const st = await (await fetch('/workflow.json', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})).json();
    lastStateSig = JSON.stringify({p:st.params, r:st.prompts, o:st.overlay, c:st.changelog});
    render(st); toast('已保存覆盖', true); dirty=false;
  }catch(err){toast('保存失败：'+err, false);}
}
async function reset(){
  const book = new URLSearchParams(location.search).get('book') || $('booksel').value;
  if(!book || !confirm('清除 '+book+' 的提示词/参数覆盖？')) return;
  try{
    const st = await (await fetch('/workflow.json', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({book, action:'clear'})})).json();
    lastStateSig = JSON.stringify({p:st.params, r:st.prompts, o:st.overlay, c:st.changelog});
    render(st); toast('已清除覆盖', true); dirty=false;
  }catch(err){toast('清除失败：'+err, false);}
}
$('save').addEventListener('click', save);
$('reset').addEventListener('click', reset);
$('reload').addEventListener('click', ()=>{dirty=false; loadState();});
$('run').addEventListener('click', runChapter);
$('exch').addEventListener('change', ()=>setExampleChapter($('exch').value));
$('exlabel').textContent = pad(exampleChapter);
window.addEventListener('beforeunload',(e)=>{if(dirty){e.preventDefault();e.returnValue='';}});
loadBooks().then(loadState);
setInterval(()=>{ if(!dirty) loadState(); }, 5000);
</script></body></html>
