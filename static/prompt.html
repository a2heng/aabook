<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提示词测试</title>
<style>
:root{color-scheme:dark;--bg:#0d1017;--panel:#151a23;--panel2:#1b2230;--line:#26303f;--fg:#e6ecf3;--dim:#8b97a8;
  --accent:#5aa9ff;--ok:#43c785;--warn:#ffb454;--bad:#ff7b7b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:6;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 18px;background:#101319;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15px}
header .status{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
header .st-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
header .st-dot.on{background:var(--ok)}.header .st-dot.off{background:var(--bad)}
header .grow{flex:1}
nav a{color:var(--accent);text-decoration:none;margin-right:12px;font-size:13px}nav a.on{color:var(--fg);font-weight:700}
a{color:var(--accent);text-decoration:none}
main{padding:16px 18px 80px;max-width:1600px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card-title{font-weight:700;font-size:13px;color:var(--dim);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
textarea{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px/1.5 monospace;resize:vertical;min-height:80px}
textarea:focus{outline:none;border-color:var(--accent)}
textarea[readonly]{opacity:.85;cursor:default}
.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;transition:background .15s}
.btn:hover{background:#26303f}.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0f15;font-weight:700}
.btn.primary:hover{background:#7abfff}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.tag{display:inline-block;background:#0f1720;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--dim)}
.tag.running{border-color:var(--ok);color:var(--ok)}
.tag.done{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
#statusBar{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;gap:16px;align-items:center;padding:6px 18px;background:#101319;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
#toast{position:fixed;bottom:40px;right:18px;z-index:10;background:var(--ok);color:#0b0f15;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;display:none;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.history-item{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px}
.history-item:hover{background:var(--panel2)}
.history-item.active{background:#1a2740;border-left:3px solid var(--accent)}
.empty{color:var(--dim);font-size:13px;padding:20px;text-align:center}
.params-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.param-item{display:flex;align-items:center;gap:6px;font-size:13px}
.param-item label{color:var(--dim);min-width:80px}
.param-item input{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px;width:80px}
.param-item input:focus{outline:none;border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="brand">提示词测试</div>
  <div class="status">
    <span id="llmSt" class="st-dot off" title="LLM"></span><span>LLM</span>
    <span id="markSt" class="st-dot off" title="标注"></span><span>标注</span>
  </div>
  <div class="grow"></div>
  <nav>
    <a href="/dashboard">看板</a>
    <a href="/live">实时标记</a>
    <a href="/raw">LLM原始IO</a>
    <a class="on" href="/prompt">提示词测试</a>
    <a href="/tts">TTS测试</a>
  </nav>
</header>

<main>
  <!-- Version control -->
  <div class="card" id="versionCard">
    <div class="card-title">
      版本
      <select id="versionSel" style="background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12px">
        <option value="">Python 默认</option>
      </select>
      <button class="btn" onclick="restoreDefault()">恢复默认</button>
      <button class="btn primary" onclick="saveVersion()">保存为新版本</button>
      <span id="versionLabel" class="tag">default</span>
    </div>
  </div>

  <!-- Prompts (read-only from Python) -->
  <div class="card">
    <div class="card-title">提示词（Python 代码）<button class="btn" onclick="loadDefaults()" style="margin-left:auto">提取 Python 提示词</button></div>
    <div style="margin-bottom:8px"><div style="color:var(--dim);font-size:12px;margin-bottom:3px">LOCAL_SYSTEM</div>
      <textarea id="taLocal" rows="8" placeholder="LOCAL_SYSTEM"></textarea></div>
    <div style="margin-bottom:8px"><div style="color:var(--dim);font-size:12px;margin-bottom:3px">STEP_MARK</div>
      <textarea id="taStep" rows="4" placeholder="STEP_MARK"></textarea></div>
    <div><div style="color:var(--dim);font-size:12px;margin-bottom:3px">CHECK_MARK</div>
      <textarea id="taCheck" rows="4" placeholder="CHECK_MARK"></textarea></div>
  </div>

  <!-- Params -->
  <div class="card">
    <div class="card-title">参数</div>
    <div class="params-grid">
      <div class="param-item"><label>batch</label><input id="pBatch" type="number" value="5" min="1" max="200"></div>
      <div class="param-item"><label>max_steps</label><input id="pMaxSteps" type="number" value="120" min="1" max="5000"></div>
      <div class="param-item"><label>check_steps</label><input id="pCheckSteps" type="number" value="100" min="0" max="500"></div>
    </div>
  </div>

  <!-- Input text -->
  <div class="card">
    <div class="card-title">输入文章 <button class="btn" onclick="resetInput()" style="margin-left:auto">恢复默认输入</button></div>
    <textarea id="taInput" rows="12" placeholder="输入文章内容…"></textarea>
  </div>

  <!-- Run -->
  <div class="card">
    <div class="card-title">
      <button class="btn primary" id="runBtn" onclick="runTest()">运行章节测试</button>
      <span id="runStatus" class="tag"></span>
    </div>
  </div>

  <!-- History -->
  <div class="card" style="display:flex;gap:0;min-height:300px">
    <div style="width:280px;min-width:200px;border-right:1px solid var(--line);overflow-y:auto;max-height:500px" id="historyList">
      <div class="card-title" style="padding:10px 12px;border-bottom:1px solid var(--line)">运行历史</div>
      <div id="historyItems"><div class="empty">暂无记录</div></div>
    </div>
    <div style="flex:1;overflow-y:auto;max-height:500px;padding:14px" id="historyDetail">
      <div class="empty">点击左侧记录查看详情</div>
    </div>
  </div>
</main>

<div id="statusBar">
  <span>LLM: <span id="footLlm" style="color:var(--bad)">—</span></span>
  <span>标注: <span id="footMark" style="color:var(--dim)">—</span></span>
</div>
<div id="toast"></div>

<script>
let currentVersion = "";  // "" = Python default
let historyData = [];
let pollTimer = null;

function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block";
  setTimeout(()=>{ t.style.display="none"; },2000);
}

async function pollStatus(){
  try{
    const r=await fetch("/status.json",{cache:"no-store"});
    const d=await r.json();
    const llmEl=document.getElementById("llmSt");
    const markEl=document.getElementById("markSt");
    if(d.llm&&d.llm.up){ llmEl.className="st-dot on"; document.getElementById("footLlm").textContent="up"; document.getElementById("footLlm").style.color="var(--ok)"; }
    else{ llmEl.className="st-dot off"; document.getElementById("footLlm").textContent="down"; document.getElementById("footLlm").style.color="var(--bad)"; }
    if(d.script&&d.script.running){ markEl.className="st-dot on"; document.getElementById("footMark").textContent=d.script.phase||"running"; document.getElementById("footMark").style.color="var(--ok)"; }
    else{ markEl.className="st-dot off"; document.getElementById("footMark").textContent="idle"; document.getElementById("footMark").style.color="var(--dim)"; }
  }catch(e){}
}

async function loadDefaults(){
  try{
    const r=await fetch("/prompt/defaults");
    const d=await r.json();
    if(!d.ok) return;
    document.getElementById("taLocal").value=d.prompts.LOCAL_SYSTEM||"";
    document.getElementById("taStep").value=d.prompts.STEP_MARK||"";
    document.getElementById("taCheck").value=d.prompts.CHECK_MARK||"";
    document.getElementById("taInput").value=d.input||"";
    currentVersion="";
    document.getElementById("versionSel").value="";
    document.getElementById("versionLabel").textContent="default";
    toast("已加载 Python 默认");
  }catch(e){ toast("加载失败: "+e.message); }
}

function resetInput(){
  loadDefaults();
}

async function loadVersions(){
  try{
    const r=await fetch("/prompt/versions");
    const d=await r.json();
    if(!d.ok) return;
    const sel=document.getElementById("versionSel");
    sel.innerHTML='<option value="">Python 默认</option>';
    for(const v of d.versions){
      const opt=document.createElement("option");
      opt.value=v.id; opt.textContent=v.label||v.id;
      sel.appendChild(opt);
    }
  }catch(e){}
}

document.getElementById("versionSel").addEventListener("change", async function(){
  const vid=this.value;
  if(!vid){ loadDefaults(); return; }
  try{
    const r=await fetch("/prompt/version/"+encodeURIComponent(vid));
    const d=await r.json();
    if(!d.ok) return;
    const v=d.version;
    document.getElementById("taLocal").value=v.prompts?.LOCAL_SYSTEM||"";
    document.getElementById("taStep").value=v.prompts?.STEP_MARK||"";
    document.getElementById("taCheck").value=v.prompts?.CHECK_MARK||"";
    document.getElementById("taInput").value=v.input||"";
    if(v.params){
      if(v.params.batch) document.getElementById("pBatch").value=v.params.batch;
      if(v.params.max_steps) document.getElementById("pMaxSteps").value=v.params.max_steps;
      if(v.params.check_steps) document.getElementById("pCheckSteps").value=v.params.check_steps;
    }
    currentVersion=vid;
    document.getElementById("versionLabel").textContent=v.label||vid;
    toast("已加载版本 "+(v.label||vid));
  }catch(e){ toast("加载失败"); }
});

async function saveVersion(){
  const label=prompt("版本名称:", new Date().toLocaleString("zh-CN"));
  if(label===null) return;
  try{
    const payload={
      id: "v"+Date.now(),
      label: label||undefined,
      prompts:{
        LOCAL_SYSTEM: document.getElementById("taLocal").value,
        STEP_MARK: document.getElementById("taStep").value,
        CHECK_MARK: document.getElementById("taCheck").value
      },
      input: document.getElementById("taInput").value,
      params:{
        batch: parseInt(document.getElementById("pBatch").value)||5,
        max_steps: parseInt(document.getElementById("pMaxSteps").value)||120,
        check_steps: parseInt(document.getElementById("pCheckSteps").value)||100
      }
    };
    const r=await fetch("/prompt/version",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const d=await r.json();
    if(d.ok){
      currentVersion=payload.id;
      document.getElementById("versionSel").value=currentVersion;
      document.getElementById("versionLabel").textContent=payload.id;
      await loadVersions();
      toast("版本已保存");
    }else toast("保存失败");
  }catch(e){ toast("保存失败: "+e.message); }
}

async function restoreDefault(){
  if(!confirm("恢复到 Python 默认提示词？")) return;
  await loadDefaults();
  toast("已恢复默认");
}

async function runTest(){
  const btn=document.getElementById("runBtn");
  const st=document.getElementById("runStatus");
  if(!confirm("运行章节测试？将自动保存当前状态。")) return;
  btn.disabled=true; st.className="tag running"; st.textContent="运行中…";
  try{
    const payload={
      version_id: currentVersion||("v"+Date.now()),
      prompts:{
        LOCAL_SYSTEM: document.getElementById("taLocal").value,
        STEP_MARK: document.getElementById("taStep").value,
        CHECK_MARK: document.getElementById("taCheck").value
      },
      input: document.getElementById("taInput").value,
      params:{
        batch: parseInt(document.getElementById("pBatch").value)||5,
        max_steps: parseInt(document.getElementById("pMaxSteps").value)||120,
        check_steps: parseInt(document.getElementById("pCheckSteps").value)||100
      }
    };
    const r=await fetch("/prompt/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const d=await r.json();
    if(d.ok){
      st.className="tag done"; st.textContent="已完成 (PID "+d.pid+")";
      toast("测试已启动");
      setTimeout(loadHistory,1000);
    }else{
      st.className="tag"; st.textContent="失败";
      toast(d.message||"启动失败");
    }
  }catch(e){ st.className="tag"; st.textContent="失败"; toast("失败: "+e.message); }
  btn.disabled=false;
}

async function loadHistory(){
  try{
    const r=await fetch("/prompt/history");
    const d=await r.json();
    if(!d.ok) return;
    historyData=d.runs;
    const el=document.getElementById("historyItems");
    if(!d.runs.length){ el.innerHTML='<div class="empty">暂无记录</div>'; return; }
    el.innerHTML="";
    for(const run of d.runs){
      const item=document.createElement("div");
      item.className="history-item";
      item.dataset.id=run.id;
      item.innerHTML=`<span style="color:var(--dim);font-size:12px">${run.started_at||""}</span>
        <span class="tag">${run.version_id||"-"}</span>
        <span style="flex:1"></span>
        <span style="color:var(--dim);font-size:11px">${run.id}</span>`;
      item.onclick=()=>viewRun(run.id);
      el.appendChild(item);
    }
  }catch(e){}
}

async function viewRun(rid){
  try{
    const r=await fetch("/prompt/run/"+encodeURIComponent(rid));
    const d=await r.json();
    if(!d.ok) return;
    const run=d.run;
    const el=document.getElementById("historyDetail");
    // Highlight active
    document.querySelectorAll(".history-item").forEach(e=>e.classList.toggle("active",e.dataset.id===rid));
    el.innerHTML=`
      <div style="margin-bottom:12px">
        <div style="font-weight:700;margin-bottom:4px">记录 ${run.id}</div>
        <div style="color:var(--dim);font-size:12px">版本: ${run.version_id||"-"} · ${run.started_at||""}</div>
      </div>
      <div style="margin-bottom:10px">
        <div style="color:var(--dim);font-size:12px;margin-bottom:3px">LOCAL_SYSTEM</div>
        <div style="background:var(--panel2);border-radius:6px;padding:8px;font-size:12px;white-space:pre-wrap;max-height:150px;overflow-y:auto">${esc(run.prompts?.LOCAL_SYSTEM||"")}</div>
      </div>
      <div style="margin-bottom:10px">
        <div style="color:var(--dim);font-size:12px;margin-bottom:3px">STEP_MARK</div>
        <div style="background:var(--panel2);border-radius:6px;padding:8px;font-size:12px;white-space:pre-wrap;max-height:100px;overflow-y:auto">${esc(run.prompts?.STEP_MARK||"")}</div>
      </div>
      <div style="margin-bottom:10px">
        <div style="color:var(--dim);font-size:12px;margin-bottom:3px">CHECK_MARK</div>
        <div style="background:var(--panel2);border-radius:6px;padding:8px;font-size:12px;white-space:pre-wrap;max-height:100px;overflow-y:auto">${esc(run.prompts?.CHECK_MARK||"")}</div>
      </div>
      <div style="margin-bottom:10px">
        <div style="color:var(--dim);font-size:12px;margin-bottom:3px">输入文章</div>
        <div style="background:var(--panel2);border-radius:6px;padding:8px;font-size:12px;white-space:pre-wrap;max-height:150px;overflow-y:auto">${esc(run.input||"")}</div>
      </div>
      ${run.output?`<div>
        <div style="color:var(--dim);font-size:12px;margin-bottom:3px">输出结果</div>
        <div style="background:var(--panel2);border-radius:6px;padding:8px;font-size:12px;white-space:pre-wrap;max-height:200px;overflow-y:auto">${esc(run.output)}</div>
      </div>`:'<div class="empty">输出尚未完成或不可用</div>'}
    `;
  }catch(e){ document.getElementById("historyDetail").innerHTML='<div class="empty">加载失败</div>'; }
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// Init
(async()=>{
  await pollStatus();
  await loadDefaults();
  await loadVersions();
  await loadHistory();
  pollTimer = setInterval(pollStatus, 3000);
})();
</script>
</body></html>
